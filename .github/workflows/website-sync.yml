# FORGE SYNC — pull the Field Kits from the content system.
#
# THIS FILE BELONGS IN THE WEBSITE REPO, not in Forge. Install it at
# .github/workflows/website-sync.yml in Career-RoadMap/dareomotosho.
# Setup and the reasoning are in Forge's delivery/README.md.
#
# Why the website pulls rather than Forge pushing: the two repos are in different
# GitHub organisations and the boundary is one-way. Forge can read this repo
# anonymously (it is public) but cannot be granted push access to it — tested
# 2026-08-13, `add_repo` refuses the cross-org attach. The side that CAN write is
# this one, so this is the side that moves the files.
#
# Before this existed, delivery was a person copying files between two chats.
# On 2026-08-13 three kits were written, published, reported finished — and never
# reached the site, because nothing was carrying them and nothing was watching.
#
# WHY THERE ARE TWO CHECKOUTS OF THE SAME REPO. The first version of this file
# used one, and the website's own review made the right catch: it executed a
# script fetched at run time, unattended, with `contents: write` on this repo.
# Anyone who could push to Forge could run code in this CI and commit to main.
#
# That review concluded a SHA pin would not help, because pinning the checkout
# would freeze the kit content along with the script. True of ONE checkout —
# which is why there are two. `scripts/` comes from a pinned commit, so the code
# that runs here is fixed and reviewable. `content/` comes from the head, so the
# kits stay live. The coupling was an artefact of the single checkout, not a
# property of the design.
#
# The cost, stated honestly: when deliver_kits.py changes, FORGE_SCRIPTS_REF has
# to be bumped here, by hand. That is rare — the script reads frontmatter and
# writes a file — and it is self-detecting: Forge reads this site every evening
# and comments on Notion when the kits here stop matching what it has written.
# A stale pin shows up as "kits owed" on a phone, not as silence.

name: forge-sync

on:
  # SCHEDULE SUSPENDED 2026-08-17. Re-enable by uncommenting, but not before
  # FORGE_SCRIPTS_REF below is bumped — read the next comment block first.
  #
  # schedule:
  #   - cron: "0 6,12,18 * * *"  # three times a day; a kit is never more than ~6h late
  workflow_dispatch:

permissions:
  contents: write                # commits new kits into contents/resources/

env:
  # The Forge commit whose scripts/ this job is allowed to execute. Bump it
  # deliberately, after reading the diff — that review IS the control this pin
  # buys. A branch name here would hand the property straight back.
  #
  # WHY THE SCHEDULE ABOVE IS OFF. This pin is from 2026-08-13 and the
  # deliver_kits.py it names has NO publication gate: its export() writes every
  # kit it finds, published or not. That is what re-created all 20 kits in
  # de6553a after they were withdrawn in c75fab1 (#65), and it would have done
  # it again at the next 18:00 run.
  #
  # Forge added the gate on their main at 4f8d52a on 2026-08-17 — but a fix on
  # their main does not reach this job, because this job runs the PINNED script,
  # not their head. The pin and the fix are the whole problem: the gate cannot
  # take effect until the pin moves to a commit that contains it.
  #
  # TO RESTORE AUTOMATIC DELIVERY, in this order:
  #   1. Read the diff 5d293f0..4f8d52a in DareOmotosho-Com/Dare-s-Forge —
  #      specifically that export() refuses any kit whose asset is not
  #      `published` or later, or whose ship_receipt.json moment has not passed.
  #   2. Set FORGE_SCRIPTS_REF to 4f8d52a (or a later reviewed commit).
  #   3. Uncomment the schedule.
  # Doing 3 without 2 puts the site straight back into the loop. Doing 2 without
  # 1 gives away the only thing the pin buys.
  #
  # Until then kits arrive by `workflow_dispatch` only, and Forge's evening
  # checker will report kits as owed — so this surfaces as a nudge, not silence.
  FORGE_SCRIPTS_REF: "5d293f00985c0c8acef2af6192636f7bf6954106"

concurrency:
  group: forge-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out this site
        uses: actions/checkout@v4

      # actions/checkout handles the token rather than a URL with credentials in
      # it — the token never reaches a log line, and never reaches the git config
      # of a directory this job later commits from.
      #
      # THE CODE: pinned. This is the only Forge content this job executes.
      - name: Check out the Forge scripts at a pinned commit
        uses: actions/checkout@v4
        with:
          repository: DareOmotosho-Com/Dare-s-Forge
          ref: ${{ env.FORGE_SCRIPTS_REF }}
          token: ${{ secrets.FORGE_READ_TOKEN }}
          path: .forge-code
          sparse-checkout: scripts

      # THE KITS: live. Data, never executed — so it does not need pinning, and
      # pinning it would defeat the entire point of a sync.
      - name: Check out the Forge content at its head
        uses: actions/checkout@v4
        with:
          repository: DareOmotosho-Com/Dare-s-Forge
          token: ${{ secrets.FORGE_READ_TOKEN }}
          path: .forge-content
          sparse-checkout: content

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The copying rules live in Forge, next to their tests, and are called from
      # here. Reimplementing them in YAML is how the two repos would drift.
      #
      # Exit 2 means a kit would render wrong on this site: NOTHING is written and
      # the job fails. Add-and-update only — a kit removed upstream never takes a
      # live /resources/<slug> page down, because that URL is printed in video
      # descriptions and is load-bearing off-site.
      - name: Copy the kits in
        run: |
          set -euo pipefail
          python .forge-code/scripts/deliver_kits.py \
            --content .forge-content/content \
            --export contents/resources

      - name: Commit anything new
        run: |
          set -euo pipefail
          rm -rf .forge-code .forge-content
          git config user.name  "forge-sync[bot]"
          git config user.email "forge-sync@users.noreply.github.com"
          git add contents/resources
          if git diff --cached --quiet; then
            echo "no new or changed kits"; exit 0
          fi
          git commit -m "resources: sync Field Kits from Forge"
          git push

      # A red job in a repo nobody is watching is a silent failure with extra
      # steps, and the likeliest cause is the read token expiring. This says so in
      # the run summary — and separately, Forge reads this site every evening and
      # comments on Notion when kits are owed, so the failure surfaces on a phone
      # even if nobody opens Actions. Neither half can fail quietly on its own.
      - name: Say what broke
        if: ${{ always() && job.status != 'success' }}
        run: |
          {
            echo "### forge-sync failed"
            echo
            echo "Status: \`${{ job.status }}\`."
            echo "Most likely cause: \`FORGE_READ_TOKEN\` has expired or lost access"
            echo "to DareOmotosho-Com/Dare-s-Forge. Regenerate it (fine-grained,"
            echo "Contents: Read-only, that repo only) and update the secret."
            echo
            echo "Field Kits will stop appearing on the site until this is fixed."
          } >> "$GITHUB_STEP_SUMMARY"
